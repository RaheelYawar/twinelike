name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual dispatch lets you draft a release without pushing a tag first —
  # the tag is created by GitHub when you click "Publish release" in the UI.
  # With nuget_only it instead pushes an already-published release's package,
  # for when the publish-nuget job failed.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
      nuget_only:
        description: 'Push the published release v<version> to nuget.org instead of drafting a release'
        type: boolean
        default: false
  # Publishing a drafted release (clicking "Publish release" in the UI) fires
  # the publish-nuget job below — so the irreversible push to nuget.org sits
  # behind the same human approval gate as making the GitHub Release public.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build, pack, and draft a GitHub Release
    # Only the draft-creation path (tag push / manual dispatch). Skipped when the
    # trigger is a release being published, or a nuget_only dispatch — those
    # run publish-nuget only.
    if: github.event_name != 'release' && !inputs.nuget_only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Derive the version from the tag (push) or the input (manual dispatch).
      # Tags follow `vX.Y.Z`; the bare version (no `v`) is what NuGet wants.
      # Versions containing `-` (e.g. 0.1.0-rc1) are marked pre-release.
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing version=$VERSION, tag=$TAG, prerelease=$PRERELEASE"

      - name: Restore
        run: dotnet restore Twinelike.sln

      # -p:Version overrides the csproj's <Version> at build time, so the tag
      # is the canonical source of truth for what version a release is.
      - name: Build (Release)
        run: dotnet build Twinelike.sln -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      # Tests run as a release gate — a release is only drafted if the merged
      # DLL passes the full suite on net8.0.
      - name: Test (net8.0)
        run: dotnet test Twinelike.sln -c Release --no-build --framework net8.0

      - name: Pack
        run: dotnet pack Twinelike.csproj -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o ./dist

      # Stage three artifacts for the release:
      #   - the bare versioned DLL (drop straight into Unity/Godot/etc.)
      #   - the .nupkg (for offline NuGet consumers)
      #   - a zip bundle with DLL + doc-comment XML + README + LICENSE (one-download, all context)
      # The XML only goes in the bundle: an IDE pairs it with the DLL by file
      # name, and the bare DLL is renamed with its version.
      # No .snupkg: ILRepack's merge invalidates the PDB↔DLL signature match, so
      # a symbol package fails nuget.org validation (see Twinelike.csproj).
      - name: Stage release artifacts
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release-staging
          cp "bin/Release/netstandard2.0/twinelike.dll" "release-staging/twinelike-${VERSION}.dll"
          cp dist/*.nupkg release-staging/
          BUNDLE_DIR="Twinelike-${VERSION}"
          mkdir -p "$BUNDLE_DIR"
          cp "bin/Release/netstandard2.0/twinelike.dll" "bin/Release/netstandard2.0/twinelike.xml" "$BUNDLE_DIR/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.txt "$BUNDLE_DIR/"
          zip -r "release-staging/Twinelike-${VERSION}.zip" "$BUNDLE_DIR"
          echo "--- staged artifacts ---"
          ls -la release-staging/

      # Pull this version's section out of CHANGELOG.md to seed the release
      # body. Falls back to a placeholder if no matching entry exists.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) { exit }
              if (index($0, "[" ver "]")) { in_section = 1; next }
              next
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_No CHANGELOG.md entry matched \`${VERSION}\` — see commit log for changes._" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      # Creates the release as a DRAFT — review the body and attached
      # artifacts in the GitHub UI, then click "Publish release" to make it
      # public. (For workflow_dispatch runs, the tag is also created on publish.)
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Twinelike ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            release-staging/*

  # ──────────────────────────────────────────────────────────────────────────
  # Publish to NuGet — runs when a drafted GitHub Release is *published*
  # (you click "Publish release"), or on a nuget_only dispatch for a release
  # that's already published. Pushes the exact .nupkg that was attached to
  # and reviewed on the release — no rebuild — so what lands on nuget.org is
  # byte-identical to what you approved.
  #
  # Uses nuget.org trusted publishing, so there's no API key secret: a
  # policy on nuget.org trusts this repo's release.yml, and NuGet/login
  # trades the job's GitHub OIDC token for a one-hour key.
  # ──────────────────────────────────────────────────────────────────────────
  publish-nuget:
    name: Publish to NuGet
    if: github.event_name == 'release' || inputs.nuget_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}

    steps:
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Pull the package that this release attached. The draft check keeps a
      # dispatch from pushing a release nobody has published.
      - name: Download package asset from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::$TAG isn't a published release."
            exit 1
          fi
          mkdir -p nuget-push
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*.nupkg' \
            --dir nuget-push
          echo "--- downloaded ---"
          ls -la nuget-push

      # Right before the push: the key it returns lasts an hour. `user` is the
      # nuget.org profile name, not an email address.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: RaheelYawar

      # --skip-duplicate turns a re-run into a no-op instead of a hard failure
      # if that version is already live on nuget.org.
      - name: Push to nuget.org
        run: |
          dotnet nuget push "nuget-push/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
